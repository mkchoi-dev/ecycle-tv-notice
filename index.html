<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>E-순환로지스 사내 문화 개선 캠페인</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /*
      =====================================================
      전체 화면 구조
      =====================================================

      TV 디버깅용으로 하단 안내 영역을 크게 확보합니다.
      상단 이미지 영역: 72vh
      간격: 2vh
      하단 안내 영역: 20vh
      상하 패딩: 각 2vh
    */

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 72vh 20vh;
      gap: 2vh;
      padding: 2vh 2vw 2vh;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 32%),
        #0f172a;
    }

    /*
      =====================================================
      상단 이미지 카드 영역
      =====================================================
    */

    .visual-area {
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame {
      width: 100%;
      height: 100%;
      border-radius: 1.6vw;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        0 2.2vh 5vh rgba(0, 0, 0, 0.32),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .campaign-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      background: #ffffff;
    }

    .empty-state {
      width: 100%;
      height: 100%;
      padding: 5vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: keep-all;
    }

    .empty-title {
      font-size: 4vw;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin-bottom: 1.5vh;
    }

    .empty-desc {
      font-size: 1.6vw;
      line-height: 1.6;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
    }

    /*
      =====================================================
      하단 안내 영역
      =====================================================
    */

    .ticker-area {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .ticker-shell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 110px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
      box-shadow: 0 1.2vh 3.2vh rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
    }

    .ticker-logo-box {
      flex: 0 0 auto;
      width: 18vw;
      min-width: 260px;
      height: 100%;
      padding: 1vh 2vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 2;
      border-right: 1px solid rgba(15, 23, 42, 0.08);
    }

    .ticker-logo {
      max-width: 100%;
      max-height: 92%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }

    .ticker-logo-placeholder {
      font-size: 1.3vw;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #123f7a;
      white-space: nowrap;
    }

    .ticker-window {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .ticker-text {
      position: absolute;
      white-space: nowrap;
      font-size: 2.8vw;
      font-weight: 900;
      letter-spacing: -0.04em;
      animation: tickerMove 60s linear infinite;
      padding-left: 100%;
    }

    @keyframes tickerMove {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    /*
      =====================================================
      TV 디버그 상태 표시
      =====================================================

      테스트 완료 후 숨기려면 display: none; 으로 바꾸면 됩니다.
    */

    .status {
      display: block;
      position: fixed;
      top: 1vh;
      left: 1vw;
      z-index: 9999;
      padding: 0.8vh 1.2vw;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;
      font-size: 1.2vw;
      font-weight: 800;
    }

    .blackout {
      background: #000 !important;
    }

    .blackout .page,
    .blackout .status {
      display: none;
    }
  </style>
</head>

<body>
  <div class="page">
    <section class="visual-area">
      <div id="imageFrame" class="image-frame">
        <div class="empty-state">
          <div class="empty-title">안내 화면을 불러오는 중입니다.</div>
          <div class="empty-desc">Google Sheet 데이터를 확인하고 있습니다.</div>
        </div>
      </div>
    </section>

    <section class="ticker-area">
      <div class="ticker-shell">
        <div id="tickerLogoBox" class="ticker-logo-box">
          <div class="ticker-logo-placeholder">COMPANY</div>
        </div>

        <div class="ticker-window">
          <div id="tickerText" class="ticker-text">안내문을 불러오는 중입니다.</div>
        </div>
      </div>
    </section>
  </div>

  <div id="status" class="status"></div>

  <script>
    /*
      =====================================================
      1. 회사 CI 이미지 링크
      =====================================================
    */

    var COMPANY_CI_URL = "https://drive.google.com/file/d/18JQtgz8ztp6Ihfb-0h-R9HlSfu2IdUnk/view?usp=drive_link";

    /*
      =====================================================
      2. Google Sheet CSV 게시 URL
      =====================================================
    */

    var CAMPAIGN_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkGZ_4HDThuNeX7s-viGZUXNg9jYp2tU0Stfh7Y8jbF8zGTty37wlsvHEg4Zo5xfmEXQPjpjWPNhar/pub?gid=0&single=true&output=csv";

    var BIRTHDAY_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkGZ_4HDThuNeX7s-viGZUXNg9jYp2tU0Stfh7Y8jbF8zGTty37wlsvHEg4Zo5xfmEXQPjpjWPNhar/pub?gid=671387330&single=true&output=csv";

    /*
      =====================================================
      3. 화면 표시 시간 설정
      =====================================================
    */

    var DISPLAY_TIME_ENABLED = false;
    var DISPLAY_START_HOUR = 7;
    var DISPLAY_END_HOUR = 16;

    /*
      =====================================================
      4. 새로고침 설정
      =====================================================
    */

    var DATA_REFRESH_MS = 2 * 60 * 1000;
    var PAGE_REFRESH_MS = 60 * 60 * 1000;

    var currentCampaign = null;
    var todayBirthdays = [];

    function init() {
      renderCompanyLogo();
      updateStatus("초기화 완료");

      loadData();

      setInterval(loadData, DATA_REFRESH_MS);
      setInterval(function () {
        location.reload();
      }, PAGE_REFRESH_MS);
      setInterval(updateStatusClock, 30 * 1000);
    }

    function renderCompanyLogo() {
      var logoBox = document.getElementById("tickerLogoBox");
      var logoUrl = convertImageUrl(COMPANY_CI_URL);
      var fallbackUrl = makeDriveThumbnailUrl(COMPANY_CI_URL);

      if (!logoUrl || logoUrl.indexOf("여기에") !== -1) {
        logoBox.innerHTML = '<div class="ticker-logo-placeholder">COMPANY</div>';
        return;
      }

      logoBox.innerHTML =
        '<img ' +
          'class="ticker-logo" ' +
          'src="' + escapeAttribute(logoUrl) + '" ' +
          'data-fallback="' + escapeAttribute(fallbackUrl) + '" ' +
          'data-kind="logo" ' +
          'alt="회사 CI" ' +
          'onerror="handleImageError(this)" ' +
        '/>';
    }

    function loadData() {
      updateStatus("CSV 요청 시작");

      if (!isDisplayTime()) {
        document.body.classList.add("blackout");
        updateStatus("표시 시간 아님");
        return;
      }

      document.body.classList.remove("blackout");

      Promise.all([
        fetchText(CAMPAIGN_CSV_URL),
        fetchText(BIRTHDAY_CSV_URL)
      ])
      .then(function (results) {
        updateStatus("CSV 수신 완료");

        var campaignCsv = results[0];
        var birthdayCsv = results[1];

        validateCsvResponse(campaignCsv);
        validateCsvResponse(birthdayCsv);

        updateStatus("CSV 검증 완료");

        var campaignRows = parseCSV(campaignCsv);
        var birthdayRows = parseCSV(birthdayCsv);

        updateStatus(
          "캠페인 " +
          campaignRows.length +
          "행 / 생일 " +
          birthdayRows.length +
          "행"
        );

        currentCampaign = findTodayCampaign(campaignRows);
        todayBirthdays = findTodayBirthdays(birthdayRows);

        if (currentCampaign) {
          updateStatus("오늘 캠페인 찾음");
        } else {
          updateStatus("오늘 캠페인 없음");
        }

        render();
      })
      .catch(function (error) {
        console.error(error);

        updateStatus("오류: " + error.message);

        renderError(
          "데이터를 불러오지 못했습니다.",
          "TV 브라우저에서 CSV fetch 또는 JS 실행이 실패했을 수 있습니다."
        );
      });
    }

    function fetchText(url) {
      if (!url) {
        return Promise.reject(new Error("CSV URL이 비어 있습니다."));
      }

      var separator = url.indexOf("?") !== -1 ? "&" : "?";
      var finalUrl = url + separator + "cb=" + Date.now() + "&r=" + Math.random().toString(36).slice(2);

      return fetch(finalUrl, {
        method: "GET",
        cache: "no-store"
      }).then(function (response) {
        if (!response.ok) {
          throw new Error("CSV 요청 실패: " + response.status);
        }

        return response.text();
      });
    }

    function validateCsvResponse(text) {
      var lower = String(text || "").trim().toLowerCase();

      if (
        lower.indexOf("<!doctype html") === 0 ||
        lower.indexOf("<html") === 0 ||
        lower.indexOf("<title>google accounts</title>") !== -1
      ) {
        throw new Error("CSV가 아니라 HTML이 반환되었습니다. 시트 게시/공유 권한을 확인하세요.");
      }
    }

    function findTodayCampaign(rows) {
      var today = getTodayString();

      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];

        var enabled = normalize(row["표시여부"]).toUpperCase();
        var startDate = normalizeDate(row["시작일"]);
        var endDate = normalizeDate(row["종료일"]);

        if (enabled === "Y" && startDate <= today && endDate >= today) {
          return row;
        }
      }

      return null;
    }

    function findTodayBirthdays(rows) {
      var todayMMDD = getTodayMMDD();
      var result = [];

      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var birthday = normalizeBirthday(row["생일"]);

        if (birthday === todayMMDD) {
          result.push(row);
        }
      }

      return result;
    }

    function render() {
      renderImage();
      renderTicker();
    }

    function renderImage() {
      var frame = document.getElementById("imageFrame");

      if (!currentCampaign) {
        frame.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-title">오늘 표시할 캠페인이 없습니다.</div>' +
            '<div class="empty-desc">Campaigns 시트에서 표시여부 Y, 시작일~종료일 범위를 확인해 주세요.</div>' +
          '</div>';
        return;
      }

      var rawImageUrl = normalize(currentCampaign["이미지링크"]);
      var imageUrl = convertImageUrl(rawImageUrl);
      var fallbackImageUrl = makeDriveThumbnailUrl(rawImageUrl);

      if (!imageUrl) {
        frame.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-title">이미지 링크가 없습니다.</div>' +
            '<div class="empty-desc">Campaigns 시트의 이미지링크 칸을 확인해 주세요.</div>' +
          '</div>';
        return;
      }

      updateStatus("이미지 로딩 시도");

      frame.innerHTML =
        '<img ' +
          'class="campaign-image" ' +
          'src="' + escapeAttribute(imageUrl) + '" ' +
          'data-fallback="' + escapeAttribute(fallbackImageUrl) + '" ' +
          'data-kind="campaign" ' +
          'alt="캠페인 안내 이미지" ' +
          'onload="updateStatus(\'이미지 로딩 성공\')" ' +
          'onerror="handleImageError(this)" ' +
        '/>';
    }

    function renderTicker() {
      var ticker = document.getElementById("tickerText");
      var messages = [];

      if (currentCampaign) {
        var campaignMessage = normalize(currentCampaign["안내문구"]);

        if (campaignMessage) {
          messages.push(campaignMessage);
        }
      }

      var birthdayMessage = makeBirthdayMessage(todayBirthdays);

      if (birthdayMessage) {
        messages.push(birthdayMessage);
      }

      if (!messages.length) {
        ticker.textContent = "현재 표시할 안내문이 없습니다.";
        return;
      }

      ticker.textContent = messages.join("     ·     ");
    }

    function makeBirthdayMessage(rows) {
      if (!rows || !rows.length) return "";

      var people = [];

      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];

        var team = normalize(row["팀명"]);
        var position = normalize(row["직급"]);
        var name = normalize(row["이름"]);

        if (team && position && name) {
          people.push(team + " " + name + " " + position + "님");
        } else if (position && name) {
          people.push(name + " " + position + "님");
        } else if (name) {
          people.push(name + "님");
        }
      }

      if (!people.length) return "";

      return "🎉 오늘은 " + people.join(", ") + "의 생일입니다. 생일을 진심으로 축하드립니다!";
    }

    function isDisplayTime() {
      if (!DISPLAY_TIME_ENABLED) return true;

      var now = new Date();
      var hour = now.getHours();

      return hour >= DISPLAY_START_HOUR && hour < DISPLAY_END_HOUR;
    }

    /*
      =====================================================
      이미지 URL 변환
      =====================================================

      1차: lh3.googleusercontent.com
      2차 fallback: drive.google.com/thumbnail
      구형 TV 브라우저 호환성을 위해 optional chaining 등 최신 문법 사용 안 함.
    */

    function convertImageUrl(url) {
      var cleanUrl = normalize(url);

      if (!cleanUrl) return "";

      if (
        cleanUrl.match(/\.(png|jpg|jpeg|webp|gif)(\?.*)?$/i) ||
        cleanUrl.indexOf("images/") === 0 ||
        cleanUrl.indexOf("./") === 0 ||
        cleanUrl.indexOf("../") === 0 ||
        cleanUrl.indexOf("lh3.googleusercontent.com") !== -1 ||
        cleanUrl.indexOf("github.io") !== -1 ||
        cleanUrl.indexOf("ibb.co") !== -1 ||
        cleanUrl.indexOf("i.ibb.co") !== -1 ||
        cleanUrl.indexOf("postimg.cc") !== -1
      ) {
        return cleanUrl;
      }

      var fileId = extractDriveFileId(cleanUrl);

      if (fileId) {
        return "https://lh3.googleusercontent.com/d/" + fileId + "=w4000";
      }

      return cleanUrl;
    }

    function makeDriveThumbnailUrl(url) {
      var cleanUrl = normalize(url);

      if (!cleanUrl) return "";

      var fileId = extractDriveFileId(cleanUrl);

      if (fileId) {
        return "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w4000";
      }

      return "";
    }

    function extractDriveFileId(url) {
      var cleanUrl = normalize(url);

      if (!cleanUrl) return "";

      var driveFileMatch = cleanUrl.match(/\/file\/d\/([^/]+)/);
      var driveOpenMatch = cleanUrl.match(/[?&]id=([^&]+)/);

      if (driveFileMatch && driveFileMatch[1]) {
        return driveFileMatch[1];
      }

      if (driveOpenMatch && driveOpenMatch[1]) {
        return driveOpenMatch[1];
      }

      return "";
    }

    function handleImageError(img) {
      var fallback = img.getAttribute("data-fallback");
      var kind = img.getAttribute("data-kind");

      updateStatus("이미지 로딩 실패");

      if (fallback && img.src !== fallback) {
        updateStatus("대체 이미지 시도");
        img.src = fallback;
        img.setAttribute("data-fallback", "");
        return;
      }

      if (kind === "logo") {
        img.parentElement.innerHTML = '<div class="ticker-logo-placeholder">COMPANY</div>';
        updateStatus("CI 이미지 실패");
        return;
      }

      img.parentElement.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-title">이미지를 불러오지 못했습니다.</div>' +
          '<div class="empty-desc">TV 브라우저에서 Google Drive 이미지 로딩이 차단되었을 수 있습니다.</div>' +
        '</div>';

      updateStatus("이미지 최종 실패");
    }

    function updateStatus(message) {
      var status = document.getElementById("status");

      if (!status) return;

      var now = new Date();
      var hh = String(now.getHours()).padStart(2, "0");
      var mm = String(now.getMinutes()).padStart(2, "0");
      var ss = String(now.getSeconds()).padStart(2, "0");

      status.textContent = message + " · " + hh + ":" + mm + ":" + ss;
    }

    function updateStatusClock() {
      updateStatus("대기 중");
    }

    function renderError(title, desc) {
      var frame = document.getElementById("imageFrame");
      var ticker = document.getElementById("tickerText");

      frame.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-title">' + escapeHtml(title) + '</div>' +
          '<div class="empty-desc">' + escapeHtml(desc) + '</div>' +
        '</div>';

      ticker.textContent = "안내문 데이터를 불러오지 못했습니다.";
    }

    function getTodayString() {
      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth() + 1).padStart(2, "0");
      var dd = String(now.getDate()).padStart(2, "0");

      return yyyy + "-" + mm + "-" + dd;
    }

    function getTodayMMDD() {
      var now = new Date();
      var mm = String(now.getMonth() + 1).padStart(2, "0");
      var dd = String(now.getDate()).padStart(2, "0");

      return mm + "-" + dd;
    }

    function normalizeDate(value) {
      var text = normalize(value);

      if (!text) return "";

      var match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      if (match) {
        return match[1] + "-" + String(match[2]).padStart(2, "0") + "-" + String(match[3]).padStart(2, "0");
      }

      match = text.match(/^(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/);

      if (match) {
        return match[1] + "-" + String(match[2]).padStart(2, "0") + "-" + String(match[3]).padStart(2, "0");
      }

      var parsed = new Date(text);

      if (!isNaN(parsed.getTime())) {
        var yyyy = parsed.getFullYear();
        var mm = String(parsed.getMonth() + 1).padStart(2, "0");
        var dd = String(parsed.getDate()).padStart(2, "0");

        return yyyy + "-" + mm + "-" + dd;
      }

      return text;
    }

    function normalizeBirthday(value) {
      var text = normalize(value);

      if (!text) return "";

      var match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      if (match) {
        return String(match[2]).padStart(2, "0") + "-" + String(match[3]).padStart(2, "0");
      }

      match = text.match(/^(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/);

      if (match) {
        return String(match[2]).padStart(2, "0") + "-" + String(match[3]).padStart(2, "0");
      }

      match = text.match(/^(\d{1,2})[.\-/월\s]+(\d{1,2})/);

      if (match) {
        return String(match[1]).padStart(2, "0") + "-" + String(match[2]).padStart(2, "0");
      }

      var parsed = new Date(text);

      if (!isNaN(parsed.getTime())) {
        var mm = String(parsed.getMonth() + 1).padStart(2, "0");
        var dd = String(parsed.getDate()).padStart(2, "0");

        return mm + "-" + dd;
      }

      return text;
    }

    function normalize(value) {
      return String(value == null ? "" : value).trim();
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text);
    }

    function parseCSV(csvText) {
      var rows = [];
      var currentRow = [];
      var currentCell = "";
      var insideQuotes = false;

      for (var i = 0; i < csvText.length; i++) {
        var char = csvText[i];
        var nextChar = csvText[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          currentCell += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          currentRow.push(currentCell);
          currentCell = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && nextChar === "\n") i++;

          currentRow.push(currentCell);

          if (currentRow.some(function (cell) { return cell.trim() !== ""; })) {
            rows.push(currentRow);
          }

          currentRow = [];
          currentCell = "";
        } else {
          currentCell += char;
        }
      }

      currentRow.push(currentCell);

      if (currentRow.some(function (cell) { return cell.trim() !== ""; })) {
        rows.push(currentRow);
      }

      if (!rows.length) return [];

      var headers = rows[0].map(function (header) {
        return header.trim();
      });

      return rows.slice(1).map(function (row) {
        var obj = {};

        headers.forEach(function (header, index) {
          obj[header] = row[index] || "";
        });

        return obj;
      });
    }

    init();
  </script>
