<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>사내 안내 화면</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 32%),
        #0f172a;
    }

    .visual-area {
      flex: 1;
      min-height: 0;
      padding: 1.6vw 1.6vw 0.8vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .image-frame {
      width: 100%;
      height: 100%;
      max-width: none;
      aspect-ratio: auto;
      border-radius: 1.6vw;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        0 2.2vh 5vh rgba(0, 0, 0, 0.32),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .campaign-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      background: #ffffff;
    }

    .empty-state {
      width: 100%;
      height: 100%;
      padding: 5vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: keep-all;
    }

    .empty-title {
      font-size: 4vw;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin-bottom: 1.5vh;
    }

    .empty-desc {
      font-size: 1.6vw;
      line-height: 1.6;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
    }

    .ticker-area {
      height: 10vh;
      min-height: 80px;
      padding: 0 1.6vw 2vh;
      display: flex;
      align-items: center;
    }

    .ticker-shell {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      box-shadow: 0 1.2vh 3.2vh rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
    }

.ticker-logo-box {
  flex: 0 0 auto;
  width: 15vw;
  min-width: 210px;
  height: 100%;
  padding: 0.45vh 1.8vw;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  z-index: 2;
  border-right: 1px solid rgba(15, 23, 42, 0.08);
}

.ticker-logo {
  max-width: 100%;
  max-height: 86%;
  object-fit: contain;
  object-position: center center;
  display: block;
}

    .ticker-logo-placeholder {
      font-size: 1.15vw;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #123f7a;
      white-space: nowrap;
    }

    .ticker-window {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .ticker-text {
      position: absolute;
      white-space: nowrap;
      font-size: 1.9vw;
      font-weight: 800;
      letter-spacing: -0.04em;
      animation: tickerMove 35s linear infinite;
      padding-left: 100%;
    }

    @keyframes tickerMove {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    .status {
      position: fixed;
      top: 1.2vh;
      right: 1.5vw;
      padding: 0.5vh 0.8vw;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.65);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.85vw;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .blackout {
      background: #000 !important;
    }

    .blackout .page,
    .blackout .status {
      display: none;
    }
  </style>
</head>

<body>
  <div class="page">
    <section class="visual-area">
      <div id="imageFrame" class="image-frame">
        <div class="empty-state">
          <div class="empty-title">안내 화면을 불러오는 중입니다.</div>
          <div class="empty-desc">Google Sheet 데이터를 확인하고 있습니다.</div>
        </div>
      </div>
    </section>

    <section class="ticker-area">
      <div class="ticker-shell">
        <div id="tickerLogoBox" class="ticker-logo-box">
          <div class="ticker-logo-placeholder">COMPANY</div>
        </div>

        <div class="ticker-window">
          <div id="tickerText" class="ticker-text">안내문을 불러오는 중입니다.</div>
        </div>
      </div>
    </section>
  </div>

  <div id="status" class="status"></div>

  <script>
    /*
      =====================================================
      1. 회사 CI 이미지 링크
      =====================================================

      Google Drive 공유 링크를 그대로 넣어도 됩니다.
      예:
      const COMPANY_CI_URL = "https://drive.google.com/file/d/파일ID/view?usp=sharing";

      CI를 아직 안 넣을 거면 빈 문자열로 두면 COMPANY 텍스트가 표시됩니다.
    */

    const COMPANY_CI_URL = "https://drive.google.com/file/d/18JQtgz8ztp6Ihfb-0h-R9HlSfu2IdUnk/view?usp=drive_link";

    /*
      =====================================================
      2. Google Sheet CSV 게시 URL
      =====================================================
    */

    const CAMPAIGN_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkGZ_4HDThuNeX7s-viGZUXNg9jYp2tU0Stfh7Y8jbF8zGTty37wlsvHEg4Zo5xfmEXQPjpjWPNhar/pub?gid=0&single=true&output=csv";

    const BIRTHDAY_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkGZ_4HDThuNeX7s-viGZUXNg9jYp2tU0Stfh7Y8jbF8zGTty37wlsvHEg4Zo5xfmEXQPjpjWPNhar/pub?gid=671387330&single=true&output=csv";

    /*
      =====================================================
      3. 화면 표시 시간 설정
      =====================================================
    */

    const DISPLAY_TIME_ENABLED = false;
    const DISPLAY_START_HOUR = 7;
    const DISPLAY_END_HOUR = 16;

    /*
      =====================================================
      4. 새로고침 설정
      =====================================================
    */

    const DATA_REFRESH_MS = 2 * 60 * 1000;
    const PAGE_REFRESH_MS = 60 * 60 * 1000;

    let currentCampaign = null;
    let todayBirthdays = [];

    async function init() {
      renderCompanyLogo();
      updateStatus("데이터 불러오는 중");

      await loadData();

      setInterval(loadData, DATA_REFRESH_MS);
      setInterval(() => location.reload(), PAGE_REFRESH_MS);
      setInterval(updateStatusClock, 30 * 1000);
    }

    function renderCompanyLogo() {
      const logoBox = document.getElementById("tickerLogoBox");
      const logoUrl = convertImageUrl(COMPANY_CI_URL);

      if (!logoUrl || logoUrl.includes("여기에")) {
        logoBox.innerHTML = `<div class="ticker-logo-placeholder">COMPANY</div>`;
        return;
      }

      logoBox.innerHTML = `
        <img
          class="ticker-logo"
          src="${escapeAttribute(logoUrl)}"
          alt="회사 CI"
          onerror="this.parentElement.innerHTML = '<div class=&quot;ticker-logo-placeholder&quot;>COMPANY</div>';"
        />
      `;
    }

    async function loadData() {
      try {
        if (!isDisplayTime()) {
          document.body.classList.add("blackout");
          return;
        }

        document.body.classList.remove("blackout");

        const [campaignCsv, birthdayCsv] = await Promise.all([
          fetchText(CAMPAIGN_CSV_URL),
          fetchText(BIRTHDAY_CSV_URL)
        ]);

        validateCsvResponse(campaignCsv);
        validateCsvResponse(birthdayCsv);

        const campaignRows = parseCSV(campaignCsv);
        const birthdayRows = parseCSV(birthdayCsv);

        currentCampaign = findTodayCampaign(campaignRows);
        todayBirthdays = findTodayBirthdays(birthdayRows);

        render();
        updateStatus("정상 표시 중");
      } catch (error) {
        console.error(error);

        renderError(
          "데이터를 불러오지 못했습니다.",
          "Google Sheet CSV 게시 URL, 시트 게시 상태, 네트워크 연결을 확인해 주세요."
        );

        updateStatus("오류 발생");
      }
    }

    async function fetchText(url) {
      if (!url) {
        throw new Error("CSV URL이 비어 있습니다.");
      }

      const separator = url.includes("?") ? "&" : "?";
      const finalUrl = `${url}${separator}cb=${Date.now()}&r=${Math.random().toString(36).slice(2)}`;

      const response = await fetch(finalUrl, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`CSV 요청 실패: ${response.status}`);
      }

      return await response.text();
    }

    function validateCsvResponse(text) {
      const lower = String(text || "").trim().toLowerCase();

      if (
        lower.startsWith("<!doctype html") ||
        lower.startsWith("<html") ||
        lower.includes("<title>google accounts</title>")
      ) {
        throw new Error("CSV가 아니라 HTML이 반환되었습니다. 시트 게시/공유 권한을 확인하세요.");
      }
    }

    function findTodayCampaign(rows) {
      const today = getTodayString();

      return rows.find(row => {
        const enabled = normalize(row["표시여부"]).toUpperCase();
        const startDate = normalizeDate(row["시작일"]);
        const endDate = normalizeDate(row["종료일"]);

        return enabled === "Y" && startDate <= today && endDate >= today;
      }) || null;
    }

    function findTodayBirthdays(rows) {
      const todayMMDD = getTodayMMDD();

      return rows.filter(row => {
        const birthday = normalizeBirthday(row["생일"]);
        return birthday === todayMMDD;
      });
    }

    function render() {
      renderImage();
      renderTicker();
    }

    function renderImage() {
      const frame = document.getElementById("imageFrame");

      if (!currentCampaign) {
        frame.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">오늘 표시할 캠페인이 없습니다.</div>
            <div class="empty-desc">Campaigns 시트에서 표시여부 Y, 시작일~종료일 범위를 확인해 주세요.</div>
          </div>
        `;
        return;
      }

      const rawImageUrl = normalize(currentCampaign["이미지링크"]);
      const imageUrl = convertImageUrl(rawImageUrl);

      if (!imageUrl) {
        frame.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">이미지 링크가 없습니다.</div>
            <div class="empty-desc">Campaigns 시트의 이미지링크 칸을 확인해 주세요.</div>
          </div>
        `;
        return;
      }

      frame.innerHTML = `
        <img
          class="campaign-image"
          src="${escapeAttribute(imageUrl)}"
          alt="캠페인 안내 이미지"
          onerror="this.parentElement.innerHTML = '<div class=&quot;empty-state&quot;><div class=&quot;empty-title&quot;>이미지를 불러오지 못했습니다.</div><div class=&quot;empty-desc&quot;>Google Drive 이미지 공유 권한 또는 이미지 링크를 확인해 주세요.</div></div>';"
        />
      `;
    }

    function renderTicker() {
      const ticker = document.getElementById("tickerText");

      const messages = [];

      if (currentCampaign) {
        const campaignMessage = normalize(currentCampaign["안내문구"]);

        if (campaignMessage) {
          messages.push(campaignMessage);
        }
      }

      const birthdayMessage = makeBirthdayMessage(todayBirthdays);

      if (birthdayMessage) {
        messages.push(birthdayMessage);
      }

      if (!messages.length) {
        ticker.textContent = "현재 표시할 안내문이 없습니다.";
        return;
      }

      ticker.textContent = messages.join("     ·     ");
    }

    function makeBirthdayMessage(rows) {
      if (!rows.length) return "";

      const people = rows.map(row => {
        const team = normalize(row["팀명"]);
        const position = normalize(row["직급"]);
        const name = normalize(row["이름"]);

        if (team && position && name) {
          return `${team} ${name} ${position}님`;
        }

        if (position && name) {
          return `${name} ${position}님`;
        }

        if (name) {
          return `${name}님`;
        }

        return "";
      }).filter(Boolean);

      if (!people.length) return "";

      return `🎉 오늘은 ${people.join(", ")}의 생일입니다. 생일을 진심으로 축하드립니다!`;
    }

    function isDisplayTime() {
      if (!DISPLAY_TIME_ENABLED) return true;

      const now = new Date();
      const hour = now.getHours();

      return hour >= DISPLAY_START_HOUR && hour < DISPLAY_END_HOUR;
    }

    function convertImageUrl(url) {
      const cleanUrl = normalize(url);

      if (!cleanUrl) return "";

      if (
        cleanUrl.match(/\.(png|jpg|jpeg|webp|gif)(\?.*)?$/i) ||
        cleanUrl.startsWith("images/") ||
        cleanUrl.startsWith("./") ||
        cleanUrl.startsWith("../") ||
        cleanUrl.includes("lh3.googleusercontent.com")
      ) {
        return cleanUrl;
      }

      const driveFileMatch = cleanUrl.match(/\/file\/d\/([^/]+)/);
      const driveOpenMatch = cleanUrl.match(/[?&]id=([^&]+)/);

      const fileId = driveFileMatch?.[1] || driveOpenMatch?.[1];

      if (fileId) {
        return `https://lh3.googleusercontent.com/d/${fileId}=w4000`;
      }

      return cleanUrl;
    }

    function updateStatus(message) {
      const status = document.getElementById("status");
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");

      status.textContent = `${message} · ${hh}:${mm}`;
    }

    function updateStatusClock() {
      updateStatus("정상 표시 중");
    }

    function renderError(title, desc) {
      const frame = document.getElementById("imageFrame");
      const ticker = document.getElementById("tickerText");

      frame.innerHTML = `
        <div class="empty-state">
          <div class="empty-title">${escapeHtml(title)}</div>
          <div class="empty-desc">${escapeHtml(desc)}</div>
        </div>
      `;

      ticker.textContent = "안내문 데이터를 불러오지 못했습니다.";
    }

    function getTodayString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");

      return `${yyyy}-${mm}-${dd}`;
    }

    function getTodayMMDD() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");

      return `${mm}-${dd}`;
    }

    function normalizeDate(value) {
      const text = normalize(value);

      if (!text) return "";

      let match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      if (match) {
        return `${match[1]}-${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}`;
      }

      match = text.match(/^(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/);

      if (match) {
        return `${match[1]}-${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}`;
      }

      const parsed = new Date(text);

      if (!isNaN(parsed.getTime())) {
        const yyyy = parsed.getFullYear();
        const mm = String(parsed.getMonth() + 1).padStart(2, "0");
        const dd = String(parsed.getDate()).padStart(2, "0");

        return `${yyyy}-${mm}-${dd}`;
      }

      return text;
    }

    function normalizeBirthday(value) {
      const text = normalize(value);

      if (!text) return "";

      let match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      if (match) {
        return `${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}`;
      }

      match = text.match(/^(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/);

      if (match) {
        return `${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}`;
      }

      match = text.match(/^(\d{1,2})[.\-/월\s]+(\d{1,2})/);

      if (match) {
        return `${String(match[1]).padStart(2, "0")}-${String(match[2]).padStart(2, "0")}`;
      }

      const parsed = new Date(text);

      if (!isNaN(parsed.getTime())) {
        const mm = String(parsed.getMonth() + 1).padStart(2, "0");
        const dd = String(parsed.getDate()).padStart(2, "0");

        return `${mm}-${dd}`;
      }

      return text;
    }

    function normalize(value) {
      return String(value ?? "").trim();
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text);
    }

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentCell = "";
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          currentCell += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          currentRow.push(currentCell);
          currentCell = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && nextChar === "\n") i++;

          currentRow.push(currentCell);

          if (currentRow.some(cell => cell.trim() !== "")) {
            rows.push(currentRow);
          }

          currentRow = [];
          currentCell = "";
        } else {
          currentCell += char;
        }
      }

      currentRow.push(currentCell);

      if (currentRow.some(cell => cell.trim() !== "")) {
        rows.push(currentRow);
      }

      if (!rows.length) return [];

      const headers = rows[0].map(header => header.trim());

      return rows.slice(1).map(row => {
        const obj = {};

        headers.forEach((header, index) => {
          obj[header] = row[index] ?? "";
        });

        return obj;
      });
    }

    init();
  </script>
</body>
</html>
