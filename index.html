<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-순환로지스 사내 문화 개선 캠페인</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Malgun Gothic", sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    body { display: flex; flex-direction: column; }

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 14vh;
      gap: 1.4vh;
      padding: 1.4vw 1.4vw 2vh;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 32%),
        #0f172a;
    }

    .visual-area {
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame {
      width: 100%;
      height: 100%;
      border-radius: 1.4vw;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        0 2vh 4.5vh rgba(0, 0, 0, 0.32),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .campaign-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      background: #ffffff;
    }

    .empty-state {
      width: 100%;
      height: 100%;
      padding: 5vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: keep-all;
    }

    .empty-title {
      font-size: 3.5vw;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin-bottom: 1.5vh;
    }

    .empty-desc {
      font-size: 1.5vw;
      line-height: 1.6;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
    }

    .ticker-area {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .ticker-shell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 82px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
      box-shadow: 0 1vh 2.8vh rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
    }

    .ticker-logo-box {
      flex: 0 0 auto;
      width: 16vw;
      min-width: 220px;
      height: 100%;
      padding: 0.6vh 1.8vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 2;
      border-right: 1px solid rgba(15, 23, 42, 0.08);
    }

    .ticker-logo {
      max-width: 100%;
      max-height: 88%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }

    .ticker-logo-placeholder {
      font-size: 1.2vw;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #123f7a;
      white-space: nowrap;
    }

    .ticker-window {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .ticker-text {
      position: absolute;
      white-space: nowrap;
      font-size: 2.05vw;
      font-weight: 850;
      letter-spacing: -0.04em;
      animation: tickerMove 48s linear infinite;
      padding-left: 100%;
    }

    @keyframes tickerMove {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .status {
      display: block;
      position: fixed;
      top: 1vh;
      left: 1vw;
      z-index: 9999;
      padding: 0.8vh 1.2vw;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      font-size: 1.2vw;
      font-weight: 800;
      min-width: 16vw;
      min-height: 3.2vh;
    }

    .version-badge {
      display: none;
      position: fixed;
      right: 1vw;
      top: 1vh;
      z-index: 9999;
      padding: 0.8vh 1.2vw;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      font-size: 1.1vw;
      font-weight: 900;
      letter-spacing: -0.03em;
      box-shadow: 0 0.8vh 2vh rgba(0, 0, 0, 0.25);
    }

    .blackout { background: #000 !important; }
    .blackout .page,
    .blackout .status,
    .blackout .version-badge { display: none; }
  </style>
</head>

<body>
  <div class="page">
    <section class="visual-area">
      <div id="imageFrame" class="image-frame">
        <div class="empty-state">
          <div class="empty-title">안내 화면을 불러오는 중입니다.</div>
          <div class="empty-desc">데이터를 확인하고 있습니다.</div>
        </div>
      </div>
    </section>

    <section class="ticker-area">
      <div class="ticker-shell">
        <div id="tickerLogoBox" class="ticker-logo-box">
          <div class="ticker-logo-placeholder">COMPANY</div>
        </div>
        <div class="ticker-window">
          <div id="tickerText" class="ticker-text">안내문을 불러오는 중입니다.</div>
        </div>
      </div>
    </section>
  </div>

  <div id="status" class="status">초기화 전</div>
  <div id="versionBadge" class="version-badge"></div>

  <script>
    /* =====================================================
       0. 버전 설정
    ===================================================== */
    var APP_VERSION = "v2026.05.12-01";
    var SHOW_VERSION_BADGE = true;

    /* =====================================================
       1. 회사 CI 이미지 링크
       - Google Drive 공유 링크를 그대로 붙여넣으세요.
    ===================================================== */
    var COMPANY_CI_URL = "https://drive.google.com/file/d/18JQtgz8ztp6Ihfb-0h-R9HlSfu2IdUnk/view?usp=drive_link";

    /* =====================================================
       2. Apps Script 배포 URL
       - Apps Script 배포 후 생성된 URL을 여기에 붙여넣으세요.
       - 예: "https://script.google.com/macros/s/XXXXXXXXXX/exec"
    ===================================================== */
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm-cR1moPvCS9t-YlzuEQIWT5TP8ZjfGKAi-NKoYy-6H9jhk-9iDvenSppD-ec0azG/exec";

    /* =====================================================
       3. 화면 표시 시간 설정
    ===================================================== */
    var DISPLAY_TIME_ENABLED = false;
    var DISPLAY_START_HOUR = 7;
    var DISPLAY_END_HOUR = 16;

    /* =====================================================
       4. 새로고침 설정
    ===================================================== */
    var DATA_REFRESH_MS = 2 * 60 * 1000;   // 데이터: 2분마다
    var PAGE_REFRESH_MS = 60 * 60 * 1000;  // 페이지: 1시간마다

    /* =====================================================
       앱 상태
    ===================================================== */
    var currentCampaign = null;
    var todayBirthdays = [];

    /* =====================================================
       초기화
    ===================================================== */
    function init() {
      renderVersionBadge();
      updateStatus("초기화 시작");
      renderCompanyLogo();
      loadData();

      setInterval(loadData, DATA_REFRESH_MS);
      setInterval(function() { location.reload(); }, PAGE_REFRESH_MS);
    }

    /* =====================================================
       버전 배지
    ===================================================== */
    function renderVersionBadge() {
      var badge = document.getElementById("versionBadge");
      if (!badge) return;
      if (!SHOW_VERSION_BADGE) { badge.style.display = "none"; return; }
      badge.style.display = "block";
      badge.innerHTML = escapeHtml(APP_VERSION);
    }

    /* =====================================================
       회사 CI 로고
    ===================================================== */
    function renderCompanyLogo() {
      var logoBox = document.getElementById("tickerLogoBox");
      var logoUrl = convertImageUrl(COMPANY_CI_URL);
      var fallbackUrl = makeDriveThumbnailUrl(COMPANY_CI_URL);

      if (!logoUrl || logoUrl.indexOf("여기에") !== -1) {
        logoBox.innerHTML = '<div class="ticker-logo-placeholder">COMPANY</div>';
        return;
      }

      logoBox.innerHTML =
        '<img class="ticker-logo"' +
        ' src="' + escapeAttr(logoUrl) + '"' +
        ' data-fallback="' + escapeAttr(fallbackUrl) + '"' +
        ' data-kind="logo"' +
        ' alt="회사 CI"' +
        ' onerror="handleImageError(this)"' +
        '/>';
    }

    /* =====================================================
       데이터 로드 (Apps Script JSON)
    ===================================================== */
    function loadData() {
      if (!isDisplayTime()) {
        document.body.classList.add("blackout");
        updateStatus("표시 시간 아님");
        return;
      }
      document.body.classList.remove("blackout");

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("여기에") !== -1) {
        updateStatus("오류: Apps Script URL 미설정");
        renderError("설정이 필요합니다.", "APPS_SCRIPT_URL을 HTML 파일에 입력해 주세요.");
        return;
      }

      updateStatus("데이터 요청 중");

      var url = APPS_SCRIPT_URL + "?cb=" + new Date().getTime();
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);

      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;

        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);

            if (data.error) {
              updateStatus("스크립트 오류: " + data.error);
              renderError("데이터 처리 오류", data.error);
              return;
            }

            currentCampaign = data.campaign || null;
            todayBirthdays = data.birthdays || [];

            updateStatus(currentCampaign ? "캠페인 로드 완료" : "오늘 캠페인 없음");
            render();

          } catch (parseErr) {
            updateStatus("JSON 파싱 오류");
            renderError("데이터를 처리하지 못했습니다.", "응답을 JSON으로 파싱하지 못했습니다.");
          }
        } else {
          updateStatus("요청 실패 " + xhr.status);
          renderError("데이터를 불러오지 못했습니다.", "Apps Script 요청이 실패했습니다. (HTTP " + xhr.status + ")");
        }
      };

      xhr.onerror = function() {
        updateStatus("네트워크 오류");
        renderError("네트워크 오류", "Apps Script에 연결할 수 없습니다.");
      };

      xhr.send();
    }

    /* =====================================================
       화면 렌더링
    ===================================================== */
    function render() {
      renderImage();
      renderTicker();
    }

    function renderImage() {
      var frame = document.getElementById("imageFrame");

      if (!currentCampaign) {
        frame.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-title">오늘 표시할 캠페인이 없습니다.</div>' +
            '<div class="empty-desc">Campaigns 시트에서 표시여부 Y, 시작일~종료일 범위를 확인해 주세요.</div>' +
          '</div>';
        return;
      }

      var rawUrl = currentCampaign.imageUrl || "";
      var imageUrl = convertImageUrl(rawUrl);
      var fallbackUrl = makeDriveThumbnailUrl(rawUrl);

      if (!imageUrl) {
        frame.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-title">이미지 링크가 없습니다.</div>' +
            '<div class="empty-desc">Campaigns 시트의 이미지링크 칸을 확인해 주세요.</div>' +
          '</div>';
        return;
      }

      updateStatus("이미지 로딩 시도");
      frame.innerHTML =
        '<img class="campaign-image"' +
        ' src="' + escapeAttr(imageUrl) + '"' +
        ' data-fallback="' + escapeAttr(fallbackUrl) + '"' +
        ' data-kind="campaign"' +
        ' alt="캠페인 안내 이미지"' +
        ' onload="updateStatus(\'이미지 로딩 성공\')"' +
        ' onerror="handleImageError(this)"' +
        '/>';
    }

    function renderTicker() {
      var ticker = document.getElementById("tickerText");
      var messages = [];

      if (currentCampaign && currentCampaign.message) {
        messages.push(currentCampaign.message);
      }

      var birthdayMsg = makeBirthdayMessage(todayBirthdays);
      if (birthdayMsg) messages.push(birthdayMsg);

      ticker.textContent = messages.length
        ? messages.join("     ·     ")
        : "현재 표시할 안내문이 없습니다.";
    }

    function makeBirthdayMessage(rows) {
      if (!rows || !rows.length) return "";

      var people = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var team = r.team || "";
        var pos  = r.position || "";
        var name = r.name || "";

        if (team && pos && name) people.push(team + " " + name + " " + pos + "님");
        else if (pos && name)    people.push(name + " " + pos + "님");
        else if (name)           people.push(name + "님");
      }

      if (!people.length) return "";
      return "🎉 오늘은 " + people.join(", ") + "의 생일입니다. 생일을 진심으로 축하드립니다!";
    }

    /* =====================================================
       이미지 URL 변환 (Google Drive)
    ===================================================== */
    function convertImageUrl(url) {
      var u = String(url || "").trim();
      if (!u) return "";

      if (
        u.match(/\.(png|jpg|jpeg|webp|gif)(\?.*)?$/i) ||
        u.indexOf("lh3.googleusercontent.com") !== -1 ||
        u.indexOf("ibb.co") !== -1 ||
        u.indexOf("postimg.cc") !== -1
      ) {
        return u;
      }

      var id = extractDriveFileId(u);
      if (id) return "https://lh3.googleusercontent.com/d/" + id + "=w4000";

      return u;
    }

    function makeDriveThumbnailUrl(url) {
      var id = extractDriveFileId(String(url || "").trim());
      if (id) return "https://drive.google.com/thumbnail?id=" + id + "&sz=w4000";
      return "";
    }

    function extractDriveFileId(url) {
      var m = url.match(/\/file\/d\/([^/]+)/);
      if (m && m[1]) return m[1];
      m = url.match(/[?&]id=([^&]+)/);
      if (m && m[1]) return m[1];
      return "";
    }

    function handleImageError(img) {
      var fallback = img.getAttribute("data-fallback");
      var kind = img.getAttribute("data-kind");
      updateStatus("이미지 로딩 실패");

      if (fallback && img.src !== fallback) {
        updateStatus("대체 이미지 시도");
        img.src = fallback;
        img.setAttribute("data-fallback", "");
        return;
      }

      if (kind === "logo") {
        img.parentElement.innerHTML = '<div class="ticker-logo-placeholder">COMPANY</div>';
        updateStatus("CI 이미지 실패");
        return;
      }

      img.parentElement.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-title">이미지를 불러오지 못했습니다.</div>' +
          '<div class="empty-desc">TV 브라우저에서 Google Drive 이미지 접근이 차단되었을 수 있습니다.</div>' +
        '</div>';
      updateStatus("이미지 최종 실패");
    }

    /* =====================================================
       유틸리티
    ===================================================== */
    function isDisplayTime() {
      if (!DISPLAY_TIME_ENABLED) return true;
      var h = new Date().getHours();
      return h >= DISPLAY_START_HOUR && h < DISPLAY_END_HOUR;
    }

    function updateStatus(message) {
      var el = document.getElementById("status");
      if (!el) return;
      var n = new Date();
      var t = pad2(n.getHours()) + ":" + pad2(n.getMinutes()) + ":" + pad2(n.getSeconds());
      el.innerHTML = escapeHtml(message + " · " + t);
    }

    function renderError(title, desc) {
      document.getElementById("imageFrame").innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-title">' + escapeHtml(title) + '</div>' +
          '<div class="empty-desc">' + escapeHtml(desc) + '</div>' +
        '</div>';
      document.getElementById("tickerText").textContent = "안내문 데이터를 불러오지 못했습니다.";
    }

    function pad2(v) {
      v = String(v);
      return v.length < 2 ? "0" + v : v;
    }

    function escapeHtml(t) {
      return String(t || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function escapeAttr(t) { return escapeHtml(t); }

    init();
  </script>
</body>
</html>
